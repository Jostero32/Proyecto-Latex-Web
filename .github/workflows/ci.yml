# Lint, tipos y tests en cada push y PR. Los tests del server necesitan Postgres, Redis y MinIO reales.
# La compilación real (`pnpm test:compile`) no corre aquí: necesita construir la imagen de TeX Live.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: latexweb
          POSTGRES_PASSWORD: latexweb
          POSTGRES_DB: latexweb
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U latexweb -d latexweb"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # MinIO no puede ir en `services`: necesita el comando `server /data`. La imagen, la de compose.
      - name: MinIO
        run: |
          image=$(grep -o 'pgsty/minio:[^ ]*' docker-compose.yml)
          docker run -d --name minio -p 59000:9000 -e MINIO_ROOT_USER=latexweb -e MINIO_ROOT_PASSWORD=latexweb-dev-secret "$image" server /data
          for i in $(seq 30); do curl -sf http://127.0.0.1:59000/minio/health/ready && exit 0; sleep 1; done; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
