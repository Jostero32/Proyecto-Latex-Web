# Lint, tipos y tests en cada push y PR. Los tests del server necesitan Postgres y Redis reales.
# La compilación real (`pnpm test:compile`) no corre aquí: necesita construir la imagen de TeX Live.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: latexweb
          POSTGRES_PASSWORD: latexweb
          POSTGRES_DB: latexweb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U latexweb -d latexweb"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
