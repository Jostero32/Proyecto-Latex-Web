<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pliego</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 4h13l6 6v18H7z' fill='%232F45C6'/%3E%3Cpath d='M20 4l6 6h-6z' fill='%238C9EFF'/%3E%3Cpath d='M11.5 16h9M11.5 21h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap"
    />
    <script>
      // Aplica el tema antes de pintar, para que no parpadee (ver src/app/theme.tsx).
      try {
        var tema = localStorage.getItem('pliego.tema');
        var oscuro = tema === 'oscuro' || (tema !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
